/* ─── Base ──────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-tap-highlight-color: transparent; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-fg);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.55;
  font-feature-settings: 'ss01', 'ss02', 'cv11';
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-height: 100dvh;
  overflow-x: hidden;
}
.app-ambient { position: fixed; inset: 0; z-index: -1; pointer-events: none; background: var(--ambient); }
a { color: var(--color-primary); text-decoration: none; }
a:hover { text-decoration: underline; }
:root[data-theme='dark'] a { color: var(--color-primary-active); }
@media (prefers-color-scheme: dark) { :root:not([data-theme='light']) a { color: var(--color-primary-active); } }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: clamp(1.6rem, 1.2rem + 1.6vw, 2.2rem); font-weight: 800; }
h2 { font-size: 1.25rem; font-weight: 700; }
h3 { font-size: 1rem; font-weight: 700; }
h4 { font-size: 0.875rem; font-weight: 600; }
p { margin: 0; }
p + p { margin-top: 0.6em; }
ul, ol { margin: 0; padding-left: 1.25rem; }
li + li { margin-top: 0.25rem; }
code, pre, kbd { font-family: var(--font-mono); font-size: 0.86em; }
code { background: var(--color-code-bg); padding: 0.08em 0.4em; border-radius: var(--radius-sm); overflow-wrap: anywhere; }
pre { background: var(--color-code-bg); padding: 0.85rem 1rem; border-radius: var(--radius-lg); overflow-x: auto; line-height: 1.5; margin: 0; }
pre code { background: none; padding: 0; font-size: 0.82rem; }
kbd { background: var(--color-muted); border: 1px solid var(--color-border-strong); border-bottom-width: 2px; border-radius: 0.3rem; padding: 0 0.35em; font-size: 0.8em; }
strong { font-weight: 650; }
small { font-size: 0.8rem; color: var(--color-muted-fg); }
hr { border: 0; border-top: 1px solid var(--color-border); margin: 1rem 0; }
button { font: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--color-border-strong); border-radius: 4px; }

/* ─── Shell : sidebar / rail / tabbar ───────────────────────────────── */
.sb {
  position: fixed; top: 0; left: 0; z-index: 40;
  display: none; flex-direction: column;
  height: 100dvh; width: var(--rail-w);
  padding-top: env(safe-area-inset-top, 0px);
  background: var(--color-sidebar); color: var(--color-sidebar-fg);
  border-right: 1px solid oklch(0.25 0.015 280);
}
.sb-brand { display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; padding: 0 14px; color: inherit; text-decoration: none; }
.sb-brand:hover { background: oklch(1 0 0 / 0.06); text-decoration: none; }
.sb-logo { width: 30px; height: 30px; border-radius: 9px; flex: none; background: linear-gradient(135deg, var(--color-primary), oklch(0.62 0.2 262)); display: grid; place-items: center; box-shadow: 0 0 0 1px oklch(1 0 0 / 0.1) inset; }
.sb-logo svg { width: 20px; height: 20px; }
.sb-name { display: none; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
.sb-search { display: none; align-items: center; gap: 7px; height: 30px; margin: 4px 10px 6px; padding: 0 9px; border-radius: 7px; background: oklch(1 0 0 / 0.08); color: var(--color-sidebar-muted); }
.sb-search svg { width: 14px; height: 14px; flex: none; }
.sb-search input { flex: 1 1 auto; min-width: 0; background: none; border: 0; outline: none; font: inherit; font-size: 13px; color: var(--color-sidebar-fg); }
.sb-search input::placeholder { color: var(--color-sidebar-muted); }
.sb-list { display: flex; flex-direction: column; gap: 2px; padding: 6px 10px 12px; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; flex: 1 1 auto; }
.sb-sec { padding: 12px 10px 4px; font-size: 11px; font-weight: 600; color: var(--color-sidebar-muted); text-transform: uppercase; letter-spacing: 0.06em; display: none; }
.sb-item { display: flex; align-items: center; justify-content: center; gap: 9px; min-height: 36px; padding: 6px 8px; border-radius: 8px; color: var(--color-sidebar-muted); text-decoration: none; font-size: 13.5px; font-weight: 500; transition: background-color var(--duration-fast) var(--ease-default), color var(--duration-fast) var(--ease-default); }
.sb-item:hover { background: var(--color-sidebar-hover); color: var(--color-sidebar-fg); text-decoration: none; }
.sb-item[aria-current='page'] { background: var(--color-sidebar-active); color: var(--color-sidebar-fg); font-weight: 600; box-shadow: inset 3px 0 0 var(--color-sidebar-active-border); }
.sb-item svg { width: 20px; height: 20px; flex: none; }
.sb-item span { display: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-item .sb-pct { display: none; margin-left: auto; font-size: 11px; color: var(--color-sidebar-muted); font-weight: 500; }
.sb-foot { padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid oklch(1 0 0 / 0.08); display: flex; flex-direction: column; gap: 6px; align-items: center; }
.sb-foot small { color: var(--color-sidebar-muted); display: none; text-align: center; line-height: 1.3; }
.theme-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: var(--radius-pill); border: 1px solid oklch(1 0 0 / 0.14); background: oklch(1 0 0 / 0.06); color: var(--color-sidebar-fg); font-size: 12px; font-weight: 500; }
.theme-btn svg { width: 15px; height: 15px; }
.theme-btn span { display: none; }
.theme-btn:hover { background: oklch(1 0 0 / 0.12); }

@media (min-width: 768px) {
  .sb { display: flex; }
}
@media (min-width: 1024px) {
  .sb { width: var(--sidebar-w); background: var(--color-sidebar-glass); -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%); border-right-color: oklch(1 0 0 / 0.07); }
  .sb-brand { justify-content: flex-start; }
  .sb-name, .sb-sec, .sb-item span, .sb-item .sb-pct, .sb-foot small, .theme-btn span { display: inline; }
  .sb-search { display: flex; }
  .sb-item { justify-content: flex-start; padding: 6px 10px; }
  .sb-item span { display: inline; }
}
@media (prefers-reduced-transparency: reduce) { .sb { background: var(--color-sidebar); -webkit-backdrop-filter: none; backdrop-filter: none; } }

.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 10px;
  padding: calc(8px + env(safe-area-inset-top, 0px)) 16px 8px;
  background: var(--color-topbar); border-bottom: 1px solid var(--color-topbar-border);
  -webkit-backdrop-filter: blur(16px) saturate(160%); backdrop-filter: blur(16px) saturate(160%);
}
.topbar .tb-logo { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, var(--color-primary), oklch(0.62 0.2 262)); display: grid; place-items: center; flex: none; }
.topbar .tb-logo svg { width: 18px; height: 18px; }
.topbar h1 { font-size: 15px; font-weight: 700; margin: 0; flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .tb-sub { font-size: 11px; color: var(--color-muted-fg); font-weight: 500; }
.topbar .tb-btn { width: 36px; height: 36px; border-radius: var(--radius-pill); border: 1px solid var(--color-border); background: var(--color-card); color: var(--color-fg); display: grid; place-items: center; flex: none; }
.topbar .tb-btn svg { width: 18px; height: 18px; }
@media (min-width: 768px) { .topbar { display: none; } }

.tabbar {
  position: fixed; right: 0; bottom: 0; left: 0; z-index: 50;
  border-top: 1px solid var(--color-border); background: var(--color-bg);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  height: calc(60px + env(safe-area-inset-bottom, 0px));
}
.tabbar-row { display: flex; height: 60px; align-items: center; justify-content: space-around; padding: 0 6px; }
.tabbar-item { position: relative; display: flex; flex: 1 1 0; height: 100%; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 10px; color: var(--color-muted-fg); text-decoration: none; background: none; border: 0; font-size: 10px; font-weight: 500; }
.tabbar-item svg { width: 22px; height: 22px; }
.tabbar-item[aria-current='page'] { color: var(--color-primary-active); font-weight: 600; }
.tabbar-item[aria-current='page']::after { content: ''; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); width: 4px; height: 3px; border-radius: 2px; background: var(--color-primary-active); }
.tabbar-item:hover { text-decoration: none; }
@media (min-width: 768px) { .tabbar { display: none; } }

/* Feuille menu ☰ (mobile) — descend du haut, comme dans Domo */
.sheet-backdrop { position: fixed; inset: 0; z-index: 60; background: oklch(0.15 0.03 286 / 0.45); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
.sheet { position: fixed; top: 0; left: 0; right: 0; z-index: 61; max-height: 86dvh; display: flex; flex-direction: column; overflow: hidden; background: var(--color-bg); border-radius: 0 0 var(--radius-3xl) var(--radius-3xl); box-shadow: 0 20px 40px -20px oklch(0.2 0.05 286 / 0.5); padding-top: env(safe-area-inset-top, 0px); }
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px 8px; }
.sheet-head h2 { flex: 1 1 auto; font-size: 17px; }
.sheet-search { display: flex; align-items: center; gap: 8px; margin: 0 16px 8px; height: 38px; padding: 0 12px; border-radius: 10px; background: var(--color-muted); color: var(--color-muted-fg); }
.sheet-search svg { width: 16px; height: 16px; flex: none; }
.sheet-search input { flex: 1 1 auto; min-width: 0; background: none; border: 0; outline: none; font: inherit; font-size: 16px; color: var(--color-fg); }
.sheet-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 16px 16px; }
.sheet-sec { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-muted-fg); padding: 12px 4px 6px; }
.sheet-item { display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 6px 10px; border-radius: 12px; color: var(--color-fg); text-decoration: none; font-weight: 500; font-size: 15px; }
.sheet-item:hover { background: var(--color-muted); text-decoration: none; }
.sheet-item[aria-current='page'] { background: var(--color-primary-muted); color: var(--color-primary-active); }
.sheet-item .ico { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: oklch(0.985 0.01 280); flex: none; }
