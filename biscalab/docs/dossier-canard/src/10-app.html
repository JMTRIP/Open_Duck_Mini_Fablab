  function closeForm(slot) {
    if (!slot) return;
    var page = slot.closest('.page'); if (page && !slot.hasAttribute('data-after')) formClosedBy[page.id.replace('page-', '')] = true;
    if (slot.hasAttribute('data-after')) slot.parentNode.removeChild(slot); else slot.innerHTML = '';
  }
  // Le formulaire s'ouvre dans la page, à l'endroit où l'on travaille : sous la ligne de tête de la rubrique,
  // ou juste sous la carte dont on vient de cocher une case. Il reste ouvert tant qu'on ne le ferme pas.
  function openForm(kind, pre, src, auto) {
    var F = FORMS[kind]; if (!F) return;
    pre = pre || {};
    var cur = current || 'accueil';
    var host = F.page || cur;
    if (host !== cur) { pendingForm = { kind: kind, pre: pre }; location.hash = '#' + host; return; }
    var slot, inPlace = src && src.closest && (!F.page ? src.closest('.task, .chk, .card') : src.closest('.task'));
    if (inPlace) {
      var card = !F.page ? (src.closest('.task') || src.closest('.chk, .card')) : src.closest('.task'); if (!card) return;
      slot = card.nextElementSibling && card.nextElementSibling.hasAttribute('data-form-slot') ? card.nextElementSibling : null;
      if (!slot) { slot = document.createElement('div'); slot.setAttribute('data-form-slot', ''); slot.setAttribute('data-after', card.getAttribute('data-anchor') || ('c' + (++formSeq))); if (!card.getAttribute('data-anchor')) card.setAttribute('data-anchor', slot.getAttribute('data-after')); card.parentNode.insertBefore(slot, card.nextSibling); }
      slot.classList.add('inline-slot');
    } else {
      slot = $('#page-' + host + ' [data-form-slot]:not([data-after])');
      if (!slot) return;
    }
    var st = data.state || fold([]);
    var me = lsGet(ME_KEY, '');
    var uid = 'f' + (++formSeq) + '-';
    var h = '<div class="card form-card"><div class="entry-head"><h3>' + svgUse(F.icon || 'i-git') + esc(F.titre) + '</h3><button type="button" class="btn sm" data-act="form-close">' + svgUse('i-x') + 'Fermer</button></div>';
    h += '<p class="sub">' + esc(F.aide) + '</p><form class="form" autocomplete="off">';
    F.fields.forEach(function (f) {
      var id = uid + f[0], lab = f[1], type = f[2], extra = f[3], val = pre[f[0]] != null ? pre[f[0]] : '';
      var wide = type === 'textarea' || type === 'taches' || type === 'piece' || type === 'static' || f[0] === 'titre' || f[0] === 'presents';
      if (type === 'static') { h += '<div class="fld' + (wide ? ' wide' : '') + '"><label>' + esc(lab) + '</label><div class="static" data-name="' + f[0] + '" data-val="' + esc(val) + '">' + esc(val) + '</div></div>'; return; }
      h += '<div class="fld' + (wide ? ' wide' : '') + '"><label for="' + id + '">' + esc(lab) + '</label>';
      if (type === 'date') h += '<input id="' + id + '" name="' + f[0] + '" type="date" value="' + esc(val || todayISO()) + '" required>';
      else if (type === 'text') h += '<input id="' + id + '" name="' + f[0] + '" type="text" value="' + esc(val || extra || '') + '"' + (f[0] === 'titre' || f[0] === 'objet' || f[0] === 'valeur' ? ' required' : '') + '>';
      else if (type === 'number') h += '<input id="' + id + '" name="' + f[0] + '" type="number" min="0" step="1" value="' + esc(val || extra || '') + '">';
      else if (type === 'me') h += '<input id="' + id + '" name="' + f[0] + '" type="text" value="' + esc(val || me) + '" placeholder="Votre prénom" required>';
      else if (type === 'textarea') h += '<textarea id="' + id + '" name="' + f[0] + '" rows="3" placeholder="' + esc(extra || '') + '">' + esc(val) + '</textarea>';
      else if (type === 'select') h += '<select id="' + id + '" name="' + f[0] + '">' + extra.map(function (o) { var p = o.split('|'); return '<option value="' + esc(p[0]) + '"' + (String(val) === p[0] ? ' selected' : '') + '>' + esc(p[1]) + '</option>'; }).join('') + '</select>';
      else if (type === 'phase') h += '<select id="' + id + '" name="' + f[0] + '">' + PLAN.phases.map(function (p) { return '<option value="' + p.n + '"' + ((val !== '' ? String(val) : String(st.phase)) === String(p.n) ? ' selected' : '') + '>Phase ' + p.n + ' · ' + esc(p.titre) + '</option>'; }).join('') + '</select>';
      else if (type === 'piece') h += '<select id="' + id + '" name="' + f[0] + '">' + PLAN.pieces.map(function (p) { return '<option value="' + esc(p[1]) + '"' + (val === p[1] ? ' selected' : '') + '>' + esc(p[1]) + ' (' + esc(p[0]) + ', × ' + p[2] + ')</option>'; }).join('') + '<option value="autre"' + (val === 'autre' ? ' selected' : '') + '>Autre pièce (gabarit, cale, pièce modifiée…)</option></select><input type="text" name="piece_autre" value="' + esc(pre.piece_autre || '') + '" placeholder="Nom de l\'autre pièce, sans espace : gabarit-zero-servo" style="margin-top:6px">';
      else if (type === 'taches') {
        var preT = parseList(val);
        h += '<div class="tgroups" id="' + id + '">';
        PLAN.phases.forEach(function (p) {
          var rows = p.taches.filter(function (t) { return preT.indexOf(t[0]) >= 0 || taskPct(st, t[0]) < 100; });
          if (!rows.length) return;
          var v = phasePct(st, p), openG = rows.some(function (t) { return preT.indexOf(t[0]) >= 0; }) || (v > 0 && v < 100) || p.n === st.phase;
          h += '<details class="tgrp"' + (openG ? ' open' : '') + '><summary>Phase ' + p.n + ' · ' + esc(p.titre) + ' <span class="muted">(' + rows.length + ' restante' + (rows.length > 1 ? 's' : '') + ')</span></summary><div class="chklist small">' + rows.map(function (t) { var x = taskPct(st, t[0]); return '<label class="chk"><input type="checkbox" name="taches" value="' + t[0] + '"' + (preT.indexOf(t[0]) >= 0 ? ' checked' : '') + '><span class="t">' + esc(t[1]) + (x > 0 && x < 100 ? ' <small>(' + x + ' %)</small>' : '') + '</span></label>'; }).join('') + '</div></details>';
        });
        h += '</div><small class="muted">Cocher les tâches terminées pendant la séance, toutes phases confondues. Un avancement partiel se note depuis Travaux par phase.</small>';
      }
      h += '</div>';
    });
    h += '<div class="row wide" style="margin-top:4px"><button type="submit" class="btn primary">' + svgUse('i-git') + 'Préparer l\'enregistrement</button><button type="button" class="btn" data-act="form-close">Annuler</button></div></form><div class="f-out"></div></div>';
    slot.innerHTML = h;
    var body = slot.querySelector('.form-card'), form = slot.querySelector('form');
    if (!auto) {
      slot.scrollIntoView({ behavior: 'smooth', block: 'start' });
      var first = body.querySelector('input:not([type=date]):not([type=hidden]), select, textarea'); if (first) setTimeout(function () { first.focus({ preventScroll: true }); }, 350);
    }
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var v = {}; F.fields.forEach(function (f) {
        if (f[2] === 'static') { v[f[0]] = pre[f[0]] || ''; return; }
        if (f[2] === 'taches') { v[f[0]] = $$('input[name=taches]:checked', body).map(function (c) { return c.value; }).join(', '); return; }
        var el = body.querySelector('[name="' + f[0] + '"]'); v[f[0]] = el ? el.value.trim() : '';
      });
      var pa = body.querySelector('[name="piece_autre"]'); if (pa) v.piece_autre = pa.value.trim();
      if (v.par) lsSet(ME_KEY, v.par);
      var out = F.build(v), name = out.name;
      function taken(n) { return data.files.some(function (f) { return f.path === REPO.base + '/' + F.dir + '/' + n; }); }
      var existing = taken(name);
      if (existing && kind === 'seance') name = v.date + '-' + nowHHMM() + '.md';
      for (var k2 = 2; taken(name) && k2 < 20; k2++) name = name.replace(/(-\d+)?\.md$/, '-' + k2 + '.md');
      var url = ghNewUrl(F.dir, name, out.text), tooLong = url.length > 7000;
      var o = '<div class="note ok"><svg><use href="#i-check"/></svg><div><strong>Fichier prêt :</strong> <code>' + esc(REPO.base + '/' + F.dir + '/' + name) + '</code>' + (existing ? ' <span class="muted">(remplace l\'enregistrement précédent du même objet)</span>' : '') + '</div></div>';
      o += '<textarea class="io" rows="8" readonly>' + esc(out.text) + '</textarea>';
      o += '<div class="row">' + (tooLong ? '<button type="button" class="btn primary" data-act="copy">1 · Copier le texte</button><a class="btn" href="' + ghNewUrl(F.dir, name, '') + '" target="_blank" rel="noopener">2 · Ouvrir l\'éditeur GitHub et coller</a>' : '<a class="btn primary" href="' + url + '" target="_blank" rel="noopener">' + svgUse('i-git') + 'Enregistrer sur GitHub</a><button type="button" class="btn" data-act="copy">Copier le texte</button>') + '</div>';
      o += '<p class="muted" style="font-size:0.85rem">GitHub s\'ouvre avec le fichier déjà rempli : vérifier, puis <strong>Commit changes…</strong> deux fois. Revenir ici et cliquer « Actualiser » une minute plus tard.' + (tooLong ? ' Le texte est long : il faut le coller à la main dans l\'éditeur.' : '') + '</p>';
      var fo = body.querySelector('.f-out'); fo.innerHTML = o; fo.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  }

  // ─── Démarrage ───
  renderSidebar(''); renderTabs(); renderSheet('');
  updateLessonProgress();
  route();
  refresh(false);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && data.when && Date.now() - data.when > 5 * 60 * 1000) refresh(true); });
})();
</script>
